
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #cccccc;
        }

        h1 {
            text-align: center;
            color: #3730a3;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #4338ca;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            background: #ecfdf5;
            text-align: center;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Performance Predictor</h1>
        <p>Enter your details to predict your exam score.</p>

        <form action="/predict" method="POST">
            <label>Study Hours Per Day</label>
            <input type="number" name="study_hours"
                   min="0" max="24" step="0.5" required>

            <label>Attendance Percentage</label>
            <input type="number" name="attendance"
                   min="0" max="100" step="1" required>

            <label>Sleep Hours Per Day</label>
            <input type="number" name="sleep_hours"
                   min="0" max="24" step="0.5" required>

            <button type="submit">Predict Exam Score</button>
        </form>

        {% if prediction is not none %}
        <div class="result">
            <h2>Predicted Score: {{ prediction }}/100</h2>
        </div>
        {% endif %}
    </div>
</body>
</html>
